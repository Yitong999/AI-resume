<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="400" height="300" fill="#F5F5F5"/>
    
    <!-- Main Container -->
    <rect x="30" y="20" width="340" height="260" fill="#FFFFFF" filter="url(#shadow)"/>
    
    <!-- Left Sidebar -->
    <rect x="30" y="20" width="120" height="260" fill="#1A237E"/>
    <circle cx="90" cy="70" r="30" fill="#FFFFFF"/>
    <rect x="50" y="120" width="80" height="10" fill="#FFFFFF"/>
    <rect x="50" y="140" width="60" height="8" fill="#FF4081"/>
    
    <!-- Main Content -->
    <rect x="170" y="40" width="180" height="20" fill="#1A237E"/>
    <rect x="170" y="80" width="160" height="40" fill="#F5F5F5"/>
    <rect x="170" y="140" width="180" height="20" fill="#1A237E"/>
    <rect x="170" y="180" width="160" height="40" fill="#F5F5F5"/>
    
    <!-- Filter for shadow -->
    <defs>
        <filter id="shadow" x="0" y="0" width="400" height="300" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
        </filter>
    </defs>
</svg> 